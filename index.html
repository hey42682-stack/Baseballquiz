<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baseball 9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .card h1 {
      margin: 0 0 12px;
      color: #222;
      font-size: 30px;
    }

    .card p {
      margin: 0 0 25px;
      color: #666;
      font-size: 16px;
    }

    .buy-box {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 55px;
    }

    .sellfy-buy-button {
      display: inline-flex !important;
      justify-content: center;
      align-items: center;
      min-width: 180px;
      min-height: 50px;
      padding: 14px 25px;
      border-radius: 9px;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Baseball 9</h1>

      <p>
        Get Baseball 9 now.
      </p>

      <div class="buy-box">

        <a
          href="https://abd-mostarelaxing.sellfy.store/p/baseball-9-0rxId/"
          data-text="Buy now"
          class="sellfy-buy-button">
        </a>

      </div>

    </div>

  </div>

  <!-- Sellfy Buy Button -->
  <script src="https://sellfy.com/js/api_buttons.js"></script>

</body>
</html>
