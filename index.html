<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baseball Trivia Challenge</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --primary-color: #00d2ff;
      --accent-color: #ff0055;
      --text-color: #f0f6fc;
      --correct-color: #00e676;
      --wrong-color: #ff1744;
      --timer-color: #ff9800;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,210,255,0.2);
      overflow: hidden;
    }

    /* SPLASH SCREEN */
    #splash-screen {
      position: absolute;
      inset: 0;
      background: #090d12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 40px;
      animation: pulse 2s infinite ease-in-out;
    }

    .baseball-icon {
      font-size: 80px;
      display: block;
      margin-bottom: 10px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--primary-color), #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .loading-box {
      width: 80%;
      background: rgba(255,255,255,0.1);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      border-radius: 6px;
      transition: width 0.1s linear;
    }

    .loading-text {
      margin-top: 15px;
      font-size: 14px;
      color: #8b949e;
    }

    /* MAIN MENU (WITH FULLSCREEN BACKGROUND) */
    #main-menu {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 40px 20px;
      text-align: center;
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('zanjibar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .btn {
      background: linear-gradient(45deg, #00d2ff, #0072ff);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
    }

    /* GET READY SCREEN */
    #ready-screen {
      position: absolute;
      inset: 0;
      background: #0d1117;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 90;
      padding: 20px;
      text-align: center;
    }

    .game-photo {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
      margin-bottom: 25px;
      border: 3px solid rgba(255,255,255,0.1);
    }

    .ready-countdown-box {
      font-size: 48px;
      font-weight: 900;
      color: var(--primary-color);
      background: rgba(22, 27, 34, 0.8);
      padding: 15px 30px;
      border-radius: 50px;
      border: 2px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* GAME SCREEN */
    #game-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      justify-content: space-between;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hud-box {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }
