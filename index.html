<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baseball Trivia Challenge</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --primary-color: #00d2ff;
      --accent-color: #ff0055;
      --text-color: #f0f6fc;
      --correct-color: #00e676;
      --wrong-color: #ff1744;
      --timer-color: #ff9800;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      background: #0d1117;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,210,255,0.2);
      overflow: hidden;
    }

    /* FULLSCREEN BG IMAGES */
    .bg-full-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.45;
    }

    .screen-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding: 40px 20px;
    }

    /* SPLASH SCREEN */
    #splash-screen {
      position: absolute;
      inset: 0;
      background: #090d12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 40px;
    }

    .baseball-icon {
      font-size: 80px;
      display: block;
      margin-bottom: 10px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--primary-color), #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .loading-box {
      width: 80%;
      background: rgba(255,255,255,0.1);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      border-radius: 6px;
      transition: width 0.1s linear;
    }

    .loading-text {
      margin-top: 15px;
      font-size: 14px;
      color: #8b949e;
    }

    /* MAIN MENU */
    #main-menu {
      display: none;
      position: absolute;
      inset: 0;
      background: #0d1117;
    }

    .btn {
      background: linear-gradient(45deg, #00d2ff, #0072ff);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
    }

    /* GET READY SCREEN */
    #ready-screen {
      position: absolute;
      inset: 0;
      background: #0d1117;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 90;
      padding: 20px;
      text-align: center;
    }

    .game-photo {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
      margin-bottom: 25px;
      border: 3px solid rgba(255,255,255,0.1);
      background-color: #161b22;
    }

    .ready-countdown-box {
      font-size: 48px;
      font-weight: 900;
      color: var(--primary-color);
      background: rgba(22, 27, 34, 0.9);
      padding: 15px 30px;
      border-radius: 50px;
      border: 2px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* GAME SCREEN */
    #game-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      justify-content: space-between;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hud-box {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .timer-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff9800, #ff1744);
      transition: width 0.1s linear;
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      margin-bottom: 20px;
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .option-btn.correct { background: var(--correct-color) !important; color: #000; }
    .option-btn.wrong { background: var(--wrong-color) !important; color: #fff; }

    /* RESULT SCREEN */
    #result-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: #0d1117;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="splash-screen">
      <div class="logo-container">
        <span class="baseball-icon">⚾</span>
        <div class="logo-text">Baseball Quiz</div>
      </div>
      <div class="loading-box">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <div class="loading-text" id="loading-text">LOADING...</div>
    </div>

    <div id="main-menu">
      <img src="zanjibar.png" class="bg-full-image" alt="Background" onerror="this.style.display='none'" />
      <div class="screen-content" style="text-align: center;">
        <div style="margin-top: 50px;">
          <span style="font-size: 60px;">⚾</span>
          <h1 style="font-size: 30px; margin-top: 15px; text-shadow: 0 2px 10px #000;">BASEBALL TRIVIA</h1>
        </div>
        <button class="btn" id="start-btn">PLAY GAME</button>
      </div>
    </div>

    <div id="ready-screen">
      <img src="kinziball.png" alt="Baseball" class="game-photo" onerror="this.style.opacity='0.2'" />
      <h2 style="margin-bottom: 20px;">GET READY!</h2>
      <div class="ready-countdown-box">
        <span id="ready-num">5</span>
        <span id="ready-emoji">⚾</span>
      </div>
    </div>

    <div id="game-screen">
      <div>
        <div class="hud">
          <div class="hud-box">Q: <span id="q-num">1</span>/50</div>
          <div class="hud-box" style="color:#ff9800;">⏳ <span id="timer-text">15</span>s</div>
          <div class="hud-box">Score: <span id="score">0</span></div>
        </div>
        <div class="timer-bar-container">
          <div class="timer-bar-fill" id="timer-bar"></div>
        </div>
        <div class="question-card">
          <div id="question-text" style="font-size: 18px; font-weight: 600;">Question loading...</div>
        </div>
      </div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <div id="result-screen">
      <img src="zanjibar.png" class="bg-full-image" alt="Background" onerror="this.style.display='none'" />
      <div class="screen-content" style="text-align: center; justify-content: center; align-items: center;">
        <h2 style="font-size: 32px; text-shadow: 0 2px 10px #000;">GAME OVER!</h2>
        <h1 id="final-score" style="font-size: 65px; margin: 20px 0; color: var(--primary-color); text-shadow: 0 0 15px rgba(0,210,255,0.6);">0</h1>
        <button class="btn" id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    const AudioFX = {
      ctx: null,
      init() {
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch(e) {}
      },
      playCorrect() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch(e) {}
      },
      playWrong() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch(e) {}
      }
    };

    const quizData = [
      { q: "How many outfielders are on a standard baseball field?", a: ["3", "4", "2", "5"], c: 0 },
      { q: "How many strikes result in a strikeout?", a: ["4", "3", "2", "5"], c: 1 },
      { q: "Which team has won the most World Series titles?", a: ["Red Sox", "Dodgers", "Yankees", "Giants"], c: 2 },
      { q: "How many bases are on a standard baseball field?", a: ["3", "4", "5", "6"], c: 1 },
      { q: "What is the maximum number of outs per inning for one team?", a: ["3", "6", "2", "4"], c: 0 }
    ];

    let currentQ = 0, score = 0, canAnswer = true, timerInterval = null, timeLeft = 15;

    window.addEventListener('load', () => {
      let progress = 0;
      const interval = setInterval(() => {
        progress += 25;
        document.getElementById('loading-bar').style.width = `${progress}%`;
        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
          }, 200);
        }
      }, 50);
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      AudioFX.init();
      document.getElementById('main-menu').style.display = 'none';
      startReadyCountdown();
    });

    function startReadyCountdown() {
      const readyScreen = document.getElementById('ready-screen');
      const readyNum = document.getElementById('ready-num');
      const readyEmoji = document.getElementById('ready-emoji');
      readyScreen.style.display = 'flex';

      const steps = [
        { n: '5', e: '⚾' }, { n: '4', e: '🧢' }, { n: '3', e: '🥊' },
        { n: '2', e: '🔥' }, { n: '1', e: '🏆' }, { n: 'GO!', e: '🚀' }
      ];
      let i = 0;

      const timer = setInterval(() => {
        if (i < steps.length) {
          readyNum.innerText = steps[i].n;
          readyEmoji.innerText = steps[i].e;
          i++;
        } else {
          clearInterval(timer);
          readyScreen.style.display = 'none';
          startGame();
        }
      }, 800);
    }

    function startGame() {
      currentQ = 0; score = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      loadQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 15;
      document.getElementById('timer-text').innerText = timeLeft;
      document.getElementById('timer-bar').style.width = '100%';

      const startTime = Date.now();
      const endTime = startTime + 15000;

      timerInterval = setInterval(() => {
        const distance = endTime - Date.now();
        if (distance <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        } else {
          timeLeft = Math.ceil(distance / 1000);
          document.getElementById('timer-text').innerText = timeLeft;
          document.getElementById('timer-bar').style.width = `${(distance / 15000) * 100}%`;
        }
      }, 100);
    }

    function handleTimeout() {
      if (!canAnswer) return;
      canAnswer = false;
      AudioFX.playWrong();
      const buttons = document.getElementById('options-container').querySelectorAll('.option-btn');
      if (buttons[quizData[currentQ].c]) buttons[quizData[currentQ].c].classList.add('correct');
      setTimeout(nextQuestion, 1200);
    }

    function loadQuestion() {
      canAnswer = true;
      const q = quizData[currentQ];
      document.getElementById('q-num').innerText = currentQ + 1;
      document.getElementById('question-text').innerText = q.q;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      
      q.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });

      startTimer();
    }

    function selectOption(index, btnEl) {
      if (!canAnswer) return;
      canAnswer = false;
      clearInterval(timerInterval);

      const q = quizData[currentQ];
      const buttons = document.getElementById('options-container').querySelectorAll('.option-btn');

      if (index === q.c) {
        btnEl.classList.add('correct');
        AudioFX.playCorrect();
        score++;
        document.getElementById('score').innerText = score;
      } else {
        btnEl.classList.add('wrong');
        AudioFX.playWrong();
        if (buttons[q.c]) buttons[q.c].classList.add('correct');
      }

      setTimeout(nextQuestion, 1200);
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < quizData.length) loadQuestion();
      else showResults();
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
      document.getElementById('final-score').innerText = score;
    }

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('result-screen').style.display = 'none';
      startGame();
    });
  </script>
</body>
</html>
