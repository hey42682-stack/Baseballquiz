<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Store...</title>
    <style>
        body {
            background-color: #2c221e;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            border: 4px solid #42322b;
            border-top: 4px solid #f2a93b;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            background-color: #f2a93b;
            color: #2c221e;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <p>Opening Store in Browser...</p>

    <!-- Link m'qad l-Sellfy Direct -->
    <a id="storeLink" class="btn" href="https://abd-mostarelaxingd.sellfy.store/p/baseball-9-0rox1d/">Click here to Buy</a>

    <script type="text/javascript">
        // 1. Direct URL dyal product Sellfy
        var sellfyUrl = "https://abd-mostarelaxingd.sellfy.store/p/baseball-9-0rox1d/"; 

        // 2. Intent URL m'qad 100% BLA syntax errors f-Regex
        var intentUrl = "intent://abd-mostarelaxingd.sellfy.store/p/baseball-9-0rox1d/#Intent;scheme=https;package=com.android.chrome;end";

        // Try opening directly in Chrome
        window.location.href = intentUrl;

        // Fallback f-halat ma-fta7sh Chrome
        setTimeout(function() {
            window.location.replace(sellfyUrl);
        }, 1500);
    </script>

</body>
</html>
