<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baseball 9 — Get Access</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #243b55 0%, #141e30 45%, #090d14 100%);
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(12px);
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      margin-bottom: 18px;

      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;

      color: #dbeafe;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 38px;
      line-height: 1.15;
    }

    .description {
      margin: 0 auto 28px;
      max-width: 390px;

      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
    }

    .features {
      margin: 0 auto 30px;
      max-width: 350px;

      text-align: left;
    }

    .feature {
      margin: 10px 0;
      color: #e2e8f0;
      font-size: 15px;
    }

    .feature span {
      color: #4ade80;
      font-weight: bold;
      margin-right: 8px;
    }

    .buy-area {
      min-height: 55px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /*
      Sellfy Buy Button
    */

    .sellfy-buy-button {
      display: inline-flex !important;

      align-items: center;
      justify-content: center;

      min-width: 190px;
      min-height: 52px;

      padding: 14px 28px;

      border-radius: 10px;
      text-decoration: none;

      cursor: pointer;

      font-size: 16px;
      font-weight: 700;
    }

    .note {
      margin-top: 22px;

      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .page {
        padding: 15px;
      }

      .card {
        padding: 35px 20px;
      }

      h1 {
        font-size: 31px;
      }

      .description {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="badge">
        DIGITAL PRODUCT
      </div>

      <h1>Baseball 9</h1>

      <p class="description">
        Get your Baseball 9 product quickly and securely.
      </p>

      <div class="features">
        <div class="feature">
          <span>✓</span> Secure checkout
        </div>

        <div class="feature">
          <span>✓</span> Fast access
        </div>

        <div class="feature">
          <span>✓</span> Powered by Sellfy
        </div>
      </div>

      <!-- SELLFY BUY BUTTON -->
      <div class="buy-area">

        <a
          href="https://abd-mostarelaxing.sellfy.store/p/baseball-9-0rxId/"
          data-text="Buy Now"
          class="sellfy-buy-button">
        </a>

      </div>

      <div class="note">
        You will be taken through Sellfy's secure checkout.
      </div>

    </div>

  </div>


  <!-- SELLFY SCRIPT -->
  <script src="https://sellfy.com/js/api_buttons.js"></script>

</body>
</html>
